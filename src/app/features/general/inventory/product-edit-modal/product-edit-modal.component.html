<app-base-modal title="Editar Producto" size="md" [closeOnBackdrop]="false" (closed)="onClose()">
  <form #editForm="ngForm" (ngSubmit)="onSubmit()" [class.admin-mode]="isAdmin" [class.general-mode]="!isAdmin">
    <div class="form-grid">
      <div class="form-group">
        <label for="name">Nombre *</label>
        <input type="text" id="name" [(ngModel)]="formData.name" name="name" required
          placeholder="Nombre del producto" />
      </div>

      <div class="form-group">
        <label for="productCode">Código de Producto *</label>
        <input type="text" id="productCode" [(ngModel)]="formData.productCode" name="productCode" required
          placeholder="Ej: HAR002" />
      </div>

      <div class="form-group">
        <label for="unit">Unidad *</label>
        <select id="unit" [(ngModel)]="formData.unit" name="unit" required>
          @for (unit of allowedUnits; track unit) {
          <option [value]="unit">{{ unit }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="unitPrice">Precio Unitario (€) *</label>
        <input type="number" id="unitPrice" [(ngModel)]="formData.unitPrice" name="unitPrice" required min="0"
          step="0.01" placeholder="0.00" />
      </div>

      <div class="form-group">
        <label for="availabilityPercentage">Disponibilidad (%)</label>
        <input type="number" id="availabilityPercentage" [(ngModel)]="formData.availabilityPercentage" name="availabilityPercentage"
          min="0" max="100" step="0.01" placeholder="0.00" />
      </div>

      <div class="form-group full-width">
        <label for="supplierId">Proveedor</label>
        <select id="supplierId" [(ngModel)]="formData.supplierId" name="supplierId">
          <option [value]="undefined">Sin proveedor</option>
          @for (supplier of suppliers; track supplier.id) {
          <option [value]="supplier.id">{{ supplier.name }}</option>
          }
        </select>
      </div>
    </div>
  </form>

  <div modal-footer class="product-edit-footer">
    @if (isAdmin) {
    <button type="button" class="modal-btn modal-btn-danger" (click)="onToggleHidden()">{{ getToggleButtonText() }}</button>
    }
    <button type="button" class="modal-btn modal-btn-primary" (click)="onSubmit()" [disabled]="!editForm.valid">
      Guardar Cambios
    </button>
  </div>
</app-base-modal>
