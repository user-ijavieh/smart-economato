<div class="formulario-producto">
  <h3>{{ (isEditing ? 'PRODUCT_FORM.EDIT_TITLE' : 'PRODUCT_FORM.CREATE_TITLE') | translate }}</h3>
  <form (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label for="nombreProducto">{{ 'PRODUCT_FORM.NAME_LABEL' | translate }}</label>
        <input
          type="text"
          id="nombreProducto"
          [(ngModel)]="formProduct.name"
          name="name"
          required
        />
      </div>
      <div class="form-group">
        <label for="codigoProducto">{{ 'PRODUCT_FORM.CODE_LABEL' | translate }}</label>
        <input
          type="text"
          id="codigoProducto"
          [(ngModel)]="formProduct.productCode"
          name="productCode"
          [placeholder]="'PRODUCT_FORM.CODE_PLACEHOLDER' | translate"
          required
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="precioProducto">{{ 'PRODUCT_FORM.PRICE_LABEL' | translate }}</label>
        <input
          type="number"
          id="precioProducto"
          [(ngModel)]="formProduct.price"
          name="price"
          step="0.01"
          min="0.01"
          required
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="stockProducto">{{ 'PRODUCT_FORM.STOCK_LABEL' | translate }}</label>
        <input
          type="number"
          id="stockProducto"
          [(ngModel)]="formProduct.stock"
          name="stock"
          step="0.001"
          min="0"
          required
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="unidadProducto">{{ 'PRODUCT_FORM.UNIT_LABEL' | translate }}</label>
        <select id="unidadProducto" [(ngModel)]="formProduct.unit" name="unit" required>
          @for (unit of allowedUnits; track unit) {
            <option [value]="unit">{{ unit }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label for="loteProducto">{{ 'PRODUCT_FORM.LOT_QUANTITY_LABEL' | translate }}</label>
        <div class="input-with-unit">
          <input
            type="number"
            id="loteProducto"
            [(ngModel)]="formProduct.lotQuantity"
            name="lotQuantity"
            step="0.001"
            min="0.001"
            placeholder="Ej: 12"
          />
          @if (formProduct.unit) {
            <span class="inline-unit">{{ formProduct.unit }}</span>
          }
        </div>
        <small class="form-text">{{ 'PRODUCT_FORM.LOT_QUANTITY_HINT' | translate }}</small>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group full-width">
        <label for="proveedorProducto">{{ 'PRODUCT_FORM.SUPPLIER_LABEL' | translate }}</label>
        <app-searchable-dropdown
          [items]="supplierSearchItems"
          [selectedIds]="formProduct.supplierId ? [formProduct.supplierId] : []"
          [initialText]="selectedSupplierName"
          [placeholder]="'PRODUCT_FORM.SELECT_SUPPLIER' | translate"
          (itemSelected)="onSupplierSelected($event)"
        ></app-searchable-dropdown>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-guardar">
        {{ (isEditing ? 'PRODUCT_FORM.UPDATE_BTN' : 'COMMON.SAVE') | translate }}
      </button>
    </div>
  </form>
</div>
