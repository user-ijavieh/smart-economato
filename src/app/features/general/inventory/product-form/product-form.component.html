<div class="formulario-producto">
  <h3>{{ isEditing ? 'Editar Producto' : 'Agregar Nuevo Producto' }}</h3>
  <form (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label for="nombreProducto">Nombre *</label>
        <input
          type="text"
          id="nombreProducto"
          [(ngModel)]="formProduct.name"
          name="name"
          required
        />
      </div>
      <div class="form-group">
        <label for="codigoProducto">Código *</label>
        <input
          type="text"
          id="codigoProducto"
          [(ngModel)]="formProduct.productCode"
          name="productCode"
          placeholder="Ej: ABC-123"
          required
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="precioProducto">Precio (€) *</label>
        <input
          type="number"
          id="precioProducto"
          [(ngModel)]="formProduct.price"
          name="price"
          step="0.01"
          min="0.01"
          required
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="stockProducto">Stock Inicial *</label>
        <input
          type="number"
          id="stockProducto"
          [(ngModel)]="formProduct.stock"
          name="stock"
          step="0.001"
          min="0"
          required
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="unidadProducto">Unidad</label>
        <select id="unidadProducto" [(ngModel)]="formProduct.unit" name="unit" required>
          @for (unit of allowedUnits; track unit) {
            <option [value]="unit">{{ unit }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label for="loteProducto">Lote de Compra (Opcional)</label>
        <div class="input-with-unit">
          <input
            type="number"
            id="loteProducto"
            [(ngModel)]="formProduct.lotQuantity"
            name="lotQuantity"
            step="0.001"
            min="0.001"
            placeholder="Ej: 12"
          />
          @if (formProduct.unit) {
            <span class="inline-unit">{{ formProduct.unit }}</span>
          }
        </div>
        <small class="form-text">Cantidad mínima o múltiplo de compra.</small>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group full-width">
        <label for="proveedorProducto">Proveedor</label>
        <app-searchable-dropdown
          [items]="supplierSearchItems"
          [selectedIds]="formProduct.supplierId ? [formProduct.supplierId] : []"
          [initialText]="selectedSupplierName"
          placeholder="Seleccionar proveedor..."
          (itemSelected)="onSupplierSelected($event)"
        ></app-searchable-dropdown>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-guardar">
        {{ isEditing ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
