<app-base-modal title="Actualizar Stock" size="sm" [closeOnBackdrop]="false" (closed)="onClose()">
  <form #stockForm="ngForm" (ngSubmit)="onSubmit()" [class.admin-mode]="isAdmin" [class.general-mode]="!isAdmin">
    <div class="product-info">
      <p><strong>Producto:</strong> {{ productName }}</p>
      <p *ngIf="product">
        <strong>Stock Actual en Sistema:</strong> {{ product.currentStock }} {{ product.unit }}
      </p>
    </div>

    <div class="form-group">
      <label for="newStock">Nuevo Stock Real *</label>
      <div class="input-group">
        <input
          type="number"
          id="newStock"
          [(ngModel)]="currentStock"
          name="newStock"
          required
          min="0"
          step="0.001"
          placeholder="0"
        />
        <span class="unit-label" *ngIf="product">{{ product.unit }}</span>
      </div>
      <small class="hint">
        El sistema calculará automáticamente la diferencia y registrará un movimiento de AJUSTE.
      </small>
    </div>

    <div class="form-group">
      <label for="expirationDate">
        Fecha de Expiración
        <span *ngIf="product && currentStock > (product.currentStock || 0); else optionalText" class="required-text">(Obligatoria en incremento) <span class="required-asterisk">*</span></span>
        <ng-template #optionalText><span>(Opcional)</span></ng-template>
      </label>
      <input
        type="date"
        id="expirationDate"
        [(ngModel)]="expirationDate"
        name="expirationDate"
      />
      <small class="hint">
        Si el stock aumenta, se creará un lote con esta fecha.
      </small>
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="modal-btn modal-btn-cancel modal-btn-full" (click)="onClose()">Cancelar</button>
    <button type="button" class="modal-btn modal-btn-primary modal-btn-full" (click)="onSubmit()" [disabled]="!stockForm.valid">
      Confirmar Ajuste
    </button>
  </div>
</app-base-modal>
