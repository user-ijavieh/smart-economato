<app-base-modal title="Crear Nuevo Producto" size="md" [closeOnBackdrop]="false" (closed)="onClose()">
  <form #createForm="ngForm" (ngSubmit)="onSubmit()" [class.admin-mode]="isAdmin" [class.general-mode]="!isAdmin">
    <div class="form-grid">
      <div class="form-group">
        <label for="name">Nombre *</label>
        <input type="text" id="name" [(ngModel)]="formData.name" name="name" required
          placeholder="Nombre del producto" />
      </div>

      <div class="form-group">
        <label for="productCode">Código de Producto *</label>
        <input type="text" id="productCode" [(ngModel)]="formData.productCode" name="productCode" required
          placeholder="Ej: HAR002" />
      </div>

      <div class="form-group">
        <label for="barcode">Código de Barras</label>
        <div class="code-input-row">
          <input
            type="text"
            id="barcode"
            [(ngModel)]="formData.barcode"
            name="barcode"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="32"
            placeholder="Ej: 8412345678901"
          />
          <button type="button" class="btn-scan-code" (click)="openBarcodeScanner()" title="Escanear código de barras">
            <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px" fill="currentColor">
              <path d="M40-120v-200h80v120h120v80H40Zm680 0v-80h120v-120h80v200H720ZM160-240v-480h80v480h-80Zm120 0v-480h40v480h-40Zm120 0v-480h80v480h-80Zm120 0v-480h120v480H520Zm160 0v-480h40v480h-40Zm80 0v-480h40v480h-40ZM40-640v-200h200v80H120v120H40Zm800 0v-120H720v-80h200v200h-80Z" />
            </svg>
          </button>
        </div>
        <small class="field-hint">Solo números, por ejemplo: 8412345678901.</small>
      </div>

      <div class="form-group">
        <label for="unit">Unidad *</label>
        <select id="unit" [(ngModel)]="formData.unit" name="unit" required>
          @for (unit of allowedUnits; track unit) {
          <option [value]="unit">{{ unit }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="unitPrice">Precio Unitario (€) *</label>
        <input type="number" id="unitPrice" [(ngModel)]="formData.unitPrice" name="unitPrice" required min="0"
          step="0.01" placeholder="0.00" />
      </div>

      <div class="form-group">
        <label for="lotQuantity">Cantidad por Lote (Opcional)</label>
        <div class="input-with-unit">
          <input type="number" id="lotQuantity" [(ngModel)]="formData.lotQuantity" name="lotQuantity" step="0.001" min="0.001" placeholder="Ej: 12" />
          @if (formData.unit) {
            <span class="inline-unit">{{ formData.unit }}</span>
          }
        </div>
        <small class="field-hint">Múltiplo mínimo de compra.</small>
      </div>

      <div class="form-group">
        <label for="currentStock">Stock Inicial *</label>
        <input type="number" id="currentStock" [(ngModel)]="formData.currentStock" name="currentStock" required
          min="0" step="0.01" placeholder="0" />
      </div>

      <div class="form-group merma-group">
        <label for="availabilityPercentage">
          Disponibilidad (%)
          <span class="merma-tooltip" title="Porcentaje del producto que es aprovechable para cocinar. Ej: un plátano con 80% — de 1 kg comprado, solo 800 g son utilizables.">ⓘ</span>
        </label>
        <div class="merma-input-wrapper">
          <input type="number" id="availabilityPercentage" [(ngModel)]="formData.availabilityPercentage" name="availabilityPercentage"
            min="0" max="100" step="0.01" placeholder="100" />
          <span class="merma-suffix">% aprovechable</span>
        </div>
        <small class="field-hint">Rendimiento tras limpieza/merma. Ej: plátano ≈ 80%, pollo entero ≈ 65%.</small>
      </div>

      <div class="form-group">
        <label for="expirationDate">Fecha de Expiración (Lote Inicial) @if (formData.currentStock > 0) { <span class="required-asterisk">*</span> }</label>
        <input type="date" id="expirationDate" [(ngModel)]="formData.expirationDate" name="expirationDate" />
      </div>

      <div class="form-group full-width">
        <label for="supplierId">Proveedor</label>
        <app-searchable-dropdown
          [items]="supplierSearchItems"
          [selectedIds]="formData.supplierId ? [formData.supplierId] : []"
          [initialText]="selectedSupplierName"
          placeholder="Seleccionar proveedor..."
          (itemSelected)="onSupplierSelected($event)"
        ></app-searchable-dropdown>
      </div>
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="modal-btn modal-btn-primary modal-btn-full" (click)="onSubmit()" [disabled]="!createForm.valid">
      Crear Producto
    </button>
  </div>
</app-base-modal>

@if (showScannerModal) {
  <app-base-modal title="Escanear Código de Barras" size="md" (closed)="closeBarcodeScanner()">
    <div class="scanner-modal-body">
      <app-barcode-scanner (codeScanned)="onCodeScanned($event)"></app-barcode-scanner>
    </div>
  </app-base-modal>
}
