<app-base-modal [title]="'Procesar Recepción de Orden #' + order.id" size="fullscreen" [closeOnBackdrop]="false" headerClass="reception-header" (closed)="close()">

  <div class="order-reception-content">
      <div class="detail-group">
        <p><strong>Usuario:</strong> {{ order.userName }}</p>
        <p><strong>Fecha Solicitud:</strong> {{ order.orderDate | date:'dd/MM/yyyy' }}</p>
      </div>

      <div class="table-container">
        <table class="details-table">
          <thead>
            <tr>
              <th>Producto</th>

              <th class="text-center">Solicitado</th>
              <th class="text-center received-col">Recibido</th>
              <th class="text-center expiry-col">F. Caducidad <span class="required-asterisk">*</span></th>
            </tr>
          </thead>
          <tbody>
            @for (detail of order.details; track detail.productId) {
            <tr>
              <td>{{ detail.productName }}</td>

              <td class="text-center">{{ detail.quantity }} {{ detail.unit || 'uds' }}</td>
              <td class="text-center received-col">
                <input 
                  type="number" 
                  class="form-control quantity-input" 
                  [(ngModel)]="detail.quantityReceived" 
                  min="0"
                  [max]="detail.quantity"
                  [disabled]="isProcessing" />
              </td>
              <td class="text-center expiry-col">
                <input
                  type="date"
                  class="form-control quantity-input"
                  [(ngModel)]="detail.expirationDate"
                  [disabled]="isProcessing" />
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>
  </div>

  <div modal-footer>
    <button class="btn btn-secondary" (click)="confirmCancel()" [disabled]="isProcessing">Cancelar</button>
    <button class="btn btn-success" (click)="processReception()" [disabled]="isProcessing">
      @if (isProcessing) {
        <span>Procesando...</span>
      } @else {
        <span>Procesar Recepción</span>
      }
    </button>
  </div>
</app-base-modal>
