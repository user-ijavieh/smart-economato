<app-base-modal [title]="title" (closed)="closed.emit()">
  <div class="confirmation-shell">
    <p class="confirmation-message">{{ message }}</p>

    @if (details.length > 0) {
      <div class="confirmation-details">
        <ul>
          @for (detail of details; track $index) {
            <li>{{ detail }}</li>
          }
        </ul>
      </div>
    }
  </div>

  <div modal-footer class="confirmation-footer">
    <button
      type="button"
      class="btn-secondary"
      (click)="closed.emit()"
      [disabled]="isLoading"
    >
      {{ cancelText }}
    </button>
    <button
      type="button"
      [class.btn-danger]="isDangerous"
      [class.btn-primary]="!isDangerous"
      (click)="doConfirm()"
      [disabled]="isLoading"
    >
      {{ isLoading ? 'Procesando...' : confirmText }}
    </button>
  </div>
</app-base-modal>
