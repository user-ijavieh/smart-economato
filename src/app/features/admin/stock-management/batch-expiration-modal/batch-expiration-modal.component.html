<div class="modal-overlay" (click)="onClose()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Modificar Caducidad - Lote #{{ batch.id }}</h2>
      <button type="button" class="modal-close" (click)="onClose()" title="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="product-info">
        <p><strong>Producto:</strong> {{ batch.productName }}</p>
        <p><strong>Stock actual del lote:</strong> {{ batch.remainingQuantity | number:'1.0-2' }}</p>
        <p><strong>Caducidad actual:</strong> {{ batch.expirationDate ? (batch.expirationDate | date:'dd/MM/yyyy') : 'Sin fecha' }}</p>
      </div>

      <form #form="ngForm" (ngSubmit)="onSubmit()" class="form-container">
        <div class="form-group">
          <label for="expirationDate">Nueva Fecha de Expiración <span class="required-asterisk">*</span></label>
          <input
            type="date"
            id="expirationDate"
            name="expirationDate"
            [(ngModel)]="expirationDate"
            required
            class="form-control"
          />
        </div>

        <div class="form-group" style="margin-top: 15px;">
          <label for="reason">Motivo de la modificación (Opcional)</label>
          <input
            type="text"
            id="reason"
            name="reason"
            [(ngModel)]="reason"
            placeholder="Ej: Corrección de error de ingreso"
            class="form-control"
            maxlength="250"
          />
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="onClose()">Cancelar</button>
      <button type="button" class="btn-confirm" (click)="onSubmit()" [disabled]="!expirationDate">Guardar Cambios</button>
    </div>
  </div>
</div>
