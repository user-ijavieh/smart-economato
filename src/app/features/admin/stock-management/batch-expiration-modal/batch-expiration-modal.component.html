<app-base-modal
  [title]="'Modificar Caducidad - Lote #' + batch.id"
  size="md"
  [closeOnBackdrop]="false"
  (closed)="onClose()"
>
  <div class="product-info">
    <p><strong>Producto:</strong> {{ batch.productName }}</p>
    <p><strong>Stock actual del lote:</strong> {{ batch.remainingQuantity | number:'1.0-2' }}</p>
    <p><strong>Caducidad actual:</strong> {{ batch.expirationDate ? (batch.expirationDate | date:'dd/MM/yyyy') : 'Sin fecha' }}</p>
  </div>

  <form #form="ngForm" (ngSubmit)="onSubmit()" class="form-container">
    <div class="form-group">
      <label for="expirationDate">Nueva Fecha de Expiración <span class="required-asterisk">*</span></label>
      <input
        type="date"
        id="expirationDate"
        name="expirationDate"
        [(ngModel)]="expirationDate"
        required
        class="form-control"
      />
    </div>

    <div class="form-group" style="margin-top: 15px;">
      <label for="reason">Motivo de la modificación (Opcional)</label>
      <input
        type="text"
        id="reason"
        name="reason"
        [(ngModel)]="reason"
        placeholder="Ej: Corrección de error de ingreso"
        class="form-control"
        maxlength="250"
      />
    </div>

    <div class="form-group" style="margin-top: 15px;">
      <label for="batchCode">Código de lote (Opcional)</label>
      <input
        type="text"
        id="batchCode"
        name="batchCode"
        [(ngModel)]="batchCode"
        placeholder="Ej: LOT-2026-001"
        class="form-control"
        maxlength="100"
      />
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="modal-btn modal-btn-primary" (click)="onSubmit()" [disabled]="!expirationDate">Guardar Cambios</button>
  </div>
</app-base-modal>
