<app-base-modal title="Cambiar Estado" size="sm" [closeOnBackdrop]="false" (closed)="onClose()">
    <div class="modal-content modal-status-change">
        @if (order) {
            <div class="modal-section" style="margin-bottom: 20px;">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                    <span class="id-badge">#{{ order.id }}</span>
                    <span style="font-weight: 500; color: #666;">{{ order.userName }}</span>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #6b7280; margin-bottom: 8px;">Nuevo estado</label>
                    <select [(ngModel)]="newStatusValue" class="action-select" style="width: 100%;">
                        @for (s of allStatuses; track s.value) {
                            <option [value]="s.value">{{ s.label }}</option>
                        }
                    </select>
                </div>

                <div class="status-transition-preview">
                    <span class="status-badge admin {{ getStatusClass(order.status) }}">
                        {{ formatStatus(order.status) }}
                    </span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" />
                    </svg>
                    <span class="status-badge admin {{ getStatusClass(newStatusValue) }}">
                        {{ formatStatus(newStatusValue) }}
                    </span>
                </div>
            </div>
        }
    </div>
    <div modal-footer>
        <div class="modal-actions">
            <button class="btn-editar" (click)="confirmStatusChange()"
                [disabled]="saving || !order || newStatusValue === order.status">
                @if (saving) {
                    <span class="spinner"></span> Guardando...
                } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z" />
                        <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5v11z" />
                    </svg>
                    Guardar Cambios
                }
            </button>
        </div>
    </div>
</app-base-modal>
