@if (dialog$ | async; as dialog) {
  <div class="dialog-backdrop" (click)="onBackdropClick($event)">
    <div class="dialog-content">
      <div class="dialog-header">
        <h2>{{ dialog.title | translate:dialog.translateParams }}</h2>
      </div>
      <div class="dialog-body">
        <p [innerHTML]="dialog.message | translate:dialog.translateParams"></p>
      </div>
      <div class="dialog-footer">
        <button type="button" class="btn-cancel" (click)="cancel()">
          {{ dialog.cancelText || ('COMMON.CANCEL' | translate) }}
        </button>
        <button type="button" class="btn-confirm" (click)="confirm()">
          {{ dialog.confirmText || ('COMMON.CONFIRM' | translate) }}
        </button>
      </div>
    </div>
  </div>
}
