<div class="toast-container" [style.z-index]="zIndex()" role="region" aria-label="Notificaciones" aria-live="polite">
  @for (toast of toasts; track toast.id) {
  <div [class]="'toast toast-' + toast.type + (isExiting(toast.id) ? ' toast-exit' : '')" role="alert">

    <!-- Icono -->
    <span class="toast-icon">
      <svg width="22" height="22" aria-hidden="true">
        <use [attr.href]="'#icon-' + toast.type"></use>
      </svg>
    </span>

    <!-- Contenido: título + mensaje -->
    <div class="toast-body">
      <p class="toast-title">{{ getToastTitle(toast) }}</p>
      <p class="toast-message">{{ toast.message }}</p>
    </div>

    <!-- Cerrar -->
    <button class="toast-close" (click)="dismiss(toast.id)" aria-label="Cerrar">
      <svg width="13" height="13" aria-hidden="true">
        <use href="#icon-close"></use>
      </svg>
    </button>

    <!-- Barra de progreso -->
    @if (!toast.persistent) {
      <div class="toast-progress" [style.animation-duration.ms]="toast.duration"></div>
    }
  </div>
  }
</div>
