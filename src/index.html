<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>SmartEconomato – Gestión de Cocina</title>
  <base href="/">

  <!-- Viewport & PWA -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B84B44">
  <meta name="description"
    content="Sistema profesional de gestión de inventario, recetas y economato para cocinas y restaurantes.">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Apple iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Economato">
  <link rel="apple-touch-icon" href="/icon-192x192.png">

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/icon-512x512.png">
  <link rel="shortcut icon" type="image/png" href="/icon-192x192.png">

  <!-- Open Graph (for sharing) -->
  <meta property="og:title" content="SmartEconomato">
  <meta property="og:description" content="Gestión de inventario y economato para cocinas profesionales">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/icon-512x512.png">
  
  <!-- Additional PWA Meta Tags -->
  <meta name="color-scheme" content="light dark">
  <meta name="orientation" content="portrait">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Preconnect to API -->
  <link rel="preconnect" href="https://api.economato.local" crossorigin>
  <link rel="dns-prefetch" href="https://api.economato.local">
  
  <!-- Web Share API compatibility -->
  <meta name="msapplication-TileColor" content="#B84B44">
  <meta name="msapplication-config" content="browserconfig.xml">
</head>

<body>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <!-- Success: checkmark circle -->
    <symbol id="icon-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <polyline points="9 12 11 14 15 10" />
    </symbol>
    <!-- Error: X circle -->
    <symbol id="icon-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <line x1="15" y1="9" x2="9" y2="15" />
      <line x1="9" y1="9" x2="15" y2="15" />
    </symbol>
    <!-- Warning: triangle alert -->
    <symbol id="icon-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
      <line x1="12" y1="9" x2="12" y2="13" />
      <circle cx="12" cy="17" r="0.5" fill="currentColor" />
    </symbol>
    <!-- Info: info circle -->
    <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="16" x2="12" y2="12" />
      <circle cx="12" cy="8" r="0.5" fill="currentColor" />
    </symbol>
    <!-- Close: X -->
    <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </symbol>
  </svg>

  <app-root></app-root>
</body>

</html>
